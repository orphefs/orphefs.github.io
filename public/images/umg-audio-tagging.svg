    <line x1="70" y1="70" x2="70" y2="106"/>
    <line x1="80" y1="62" x2="80" y2="114"/>
    <line x1="90" y1="78" x2="90" y2="98"/>
    <line x1="100" y1="54" x2="100" y2="122"/>
    <line x1="110" y1="72" x2="110" y2="104"/>
    <line x1="120" y1="64" x2="120" y2="112"/>
