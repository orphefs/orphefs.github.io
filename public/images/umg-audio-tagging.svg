    <text x="178" y="103" fill="#c8d6c8">mood</text>
    <rect x="170" y="112" width="80" height="15" rx="7" fill="#0f150f" stroke="#2f4a2f"/>
    <text x="178" y="123" fill="#c8d6c8">instrument</text>
  </g>
  <text x="16" y="160" fill="#50604f" font-size="8">unified classifier · higher throughput · lower cost</text>
  <defs>
    <marker id="c" markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto">
